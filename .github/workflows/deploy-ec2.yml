name: Deploy to EC2

# Deploys the published image to the EC2 venue host. The image itself is
# built and pushed by publish-docker.yml — this workflow only pulls and
# (re)starts the container, after a successful publish or on manual dispatch.
#
# No SSH (security#12): the job assumes the covia-deploy-venue-3 IAM role
# over GitHub OIDC (trusted for covia-ai/covia on develop only, allowed only
# to run AWS-RunShellScript on this instance) and runs deploy/ec2/deploy.sh
# on the host through SSM Run Command.

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:

# Never cancel a mid-flight deploy; queue the newest instead
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          endsWith(github.event.workflow_run.display_title, '[develop]')
        )
      }}
    permissions:
      contents: read
      id-token: write   # OIDC token for the AWS role; no stored AWS keys
    env:
      INSTANCE_ID: i-0ba252844d8787529
      # The commit whose image was published (manual runs: the dispatched commit)
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.DEPLOY_SHA }}

    - name: Assume the venue-3 deploy role (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::731322152283:role/covia-deploy-venue-3
        aws-region: us-east-1

    - name: Deploy to EC2 via SSM Run Command
      run: |
        # Ship the script base64-encoded so SSM passes it through unaltered.
        script=$(base64 -w0 deploy/ec2/deploy.sh)
        params=$(jq -nc --arg c "echo $script | base64 -d | bash" \
          '{commands: [$c], executionTimeout: ["900"]}')
        command_id=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "deploy-ec2 ${DEPLOY_SHA:0:8}" \
          --timeout-seconds 120 \
          --parameters "$params" \
          --query Command.CommandId --output text)
        echo "SSM command: $command_id"

        # Poll until the command finishes (the script itself waits for health).
        status=Pending
        for i in $(seq 1 120); do
          status=$(aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
          case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
          sleep 5
        done

        aws ssm get-command-invocation --command-id "$command_id" \
          --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
        aws ssm get-command-invocation --command-id "$command_id" \
          --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2

        if [ "$status" != "Success" ]; then
          echo "::error::venue-3 deploy finished with SSM status $status"
          exit 1
        fi
