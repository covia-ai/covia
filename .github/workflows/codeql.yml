name: CodeQL

# Static security analysis. Runs on develop pushes and a weekly schedule
# rather than on every PR — the Java analysis needs a full build (including
# the Convex-from-source step), and test.yml already gates PRs.

on:
  push:
    branches: [ develop ]
  schedule:
    - cron: '14 3 * * 1'
  workflow_dispatch:

# Supersede in-flight analyses when develop moves again
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # convex.version may pin an unreleased -SNAPSHOT while validating
    # convex-side changes (see AGENTS.md). Snapshots are not on Maven
    # Central, so build the needed modules from convex develop source.
    # Skips itself when the pin is a release version. Runs BEFORE CodeQL
    # init so the dependency build isn't traced into the analysis.
    - name: Build Convex from source (snapshot pin only)
      run: |
        CONVEX_VERSION=$(sed -n 's/.*<convex.version>\(.*\)<\/convex.version>.*/\1/p' pom.xml | head -1)
        if [[ "$CONVEX_VERSION" == *-SNAPSHOT ]]; then
          echo "convex.version=$CONVEX_VERSION — building convex develop from source"
          git clone --depth 1 --branch develop https://github.com/Convex-Dev/convex.git /tmp/convex
          mvn -f /tmp/convex/pom.xml install -DskipTests -q \
            -pl convex-core,convex-peer,convex-dlfs,convex-java,convex-restapi -am
        else
          echo "convex.version=$CONVEX_VERSION (released) — skipping source build"
        fi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:java-kotlin"
