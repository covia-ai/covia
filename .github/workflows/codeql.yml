name: CodeQL

# Static security analysis. Runs on develop pushes and a weekly schedule
# rather than on every PR; the Java analysis is buildless (build-mode none), and
# test.yml already gates PRs.

on:
  push:
    branches: [ develop ]
  schedule:
    - cron: '14 3 * * 1'
  workflow_dispatch:

# Supersede in-flight analyses when develop moves again
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: java-kotlin
        build-mode: none

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:java-kotlin"
