name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Matches tags like 1.0.0, 2.1.3, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Release validation must be able to prove that the tagged commit is
        # reachable from master.
        fetch-depth: 0

    # Never a JDK 25 before 25.0.3 (JDK-8370887, late timeouts): fetch the
    # newest 25, and the build below fails on an affected one.
    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        check-latest: true
        cache: 'maven'

    - name: Set up CPython 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Select CPython shared library
      run: |
        library=$(python -c 'import os,sysconfig; print(os.path.join(sysconfig.get_config_var("LIBDIR"), sysconfig.get_config_var("LDLIBRARY")))')
        test -f "$library"
        echo "COVIA_PYTHON_LIBRARY=$library" >> "$GITHUB_ENV"

    - name: Cache Maven packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Validate release tag
      run: |
        tag="${GITHUB_REF_NAME}"
        version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)

        if [ "$version" != "$tag" ]; then
          echo "::error::Release tag '$tag' does not match Maven version '$version'"
          exit 1
        fi
        case "$version" in
          *-SNAPSHOT)
            echo "::error::Cannot release snapshot version '$version'"
            exit 1
            ;;
        esac
        if grep -R -n --include='pom.xml' -- '-SNAPSHOT' .; then
          echo "::error::Stable release contains a snapshot version in a POM"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
          echo "::error::Tagged commit $GITHUB_SHA is not reachable from origin/master"
          exit 1
        fi

    - name: Build and test with Maven
      # Opt into the @DurabilityTest crash/restart group. @IntegrationTest
      # (external services) stays off. A JDK with JDK-8370887 fails the build.
      run: mvn clean install -T 1C -Dcovia.tests.durability=true -Dcovia.jdk.check=ERROR

    - name: Verify optional module boundaries
      run: |
        test -f covia-python-adapter/target/covia-python-adapter-*-module.jar
        test -f covia-sql/target/covia-sql-*-module.jar
        test -f covia-telegram/target/covia-telegram-*-module.jar
        test -f covia-discord/target/covia-discord-*-module.jar
        test -f covia-whatsapp/target/covia-whatsapp-*-module.jar
        test -f covia-slack/target/covia-slack-*-module.jar
        test -f covia-sonnylabs/target/covia-sonnylabs-*-module.jar
        test -f covia-documents/target/covia-documents-*-module.jar
        test -f covia-speech/target/covia-speech-*-module.jar
        test -f covia-claude-code/target/covia-claude-code-*-module.jar
        if jar tf venue/target/covia.jar | grep -Eq '^(covia/python/|covia/adapter/python/|covia/adapter/sql/|covia/adapter/telegram/|covia/adapter/discord/|covia/adapter/whatsapp/|covia/adapter/slack/|covia/adapter/sonnylabs/|covia/adapter/documents/|covia/adapter/speech/|covia/adapter/claudecode/)'; then
          echo "::error::Optional module classes leaked into covia.jar"
          exit 1
        fi

    - name: Create executable checksum
      working-directory: venue/target
      run: sha256sum covia.jar > covia.jar.sha256

    - name: Create optional module checksums
      run: |
        # Run inside each jar's directory so the checksum file names the bare
        # jar and verifies with `sha256sum -c` next to the downloaded file.
        for jar in covia-python-adapter/target/*-module.jar covia-sql/target/*-module.jar covia-telegram/target/*-module.jar covia-discord/target/*-module.jar covia-whatsapp/target/*-module.jar covia-slack/target/*-module.jar covia-sonnylabs/target/*-module.jar covia-documents/target/*-module.jar covia-speech/target/*-module.jar covia-claude-code/target/*-module.jar; do
          (cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
        done

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

    - name: Get tag name
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create versioned release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ steps.tag.outputs.tag }} \
          --title "Release ${{ steps.tag.outputs.tag }}" \
          --notes "## Covia ${{ steps.tag.outputs.tag }}

        **Released:** ${{ steps.date.outputs.date }}

        See the [changelog](https://github.com/covia-ai/covia/blob/master/CHANGELOG.md) for details." \
          venue/target/covia.jar \
          venue/target/covia.jar.sha256 \
          covia-python-adapter/target/*-module.jar \
          covia-python-adapter/target/*-module.jar.sha256 \
          covia-sql/target/*-module.jar \
          covia-sql/target/*-module.jar.sha256 \
          covia-telegram/target/*-module.jar \
          covia-telegram/target/*-module.jar.sha256 \
          covia-discord/target/*-module.jar \
          covia-discord/target/*-module.jar.sha256 \
          covia-whatsapp/target/*-module.jar \
          covia-whatsapp/target/*-module.jar.sha256 \
          covia-slack/target/*-module.jar \
          covia-slack/target/*-module.jar.sha256 \
          covia-sonnylabs/target/*-module.jar \
          covia-sonnylabs/target/*-module.jar.sha256 \
          covia-documents/target/*-module.jar \
          covia-documents/target/*-module.jar.sha256 \
          covia-speech/target/*-module.jar \
          covia-speech/target/*-module.jar.sha256 \
          covia-claude-code/target/*-module.jar \
          covia-claude-code/target/*-module.jar.sha256

    - name: Update latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --yes || true
        git push origin :refs/tags/latest || true
        gh release create latest \
          --target "$GITHUB_SHA" \
          --title "Latest Release (${{ steps.tag.outputs.tag }})" \
          --notes "## Latest Stable Release

        This release mirrors **${{ steps.tag.outputs.tag }}** and is automatically updated when new versions are tagged.

        **Version:** ${{ steps.tag.outputs.tag }}
        **Released:** ${{ steps.date.outputs.date }}

        For the full release notes, see [${{ steps.tag.outputs.tag }}](https://github.com/covia-ai/covia/releases/tag/${{ steps.tag.outputs.tag }})." \
          venue/target/covia.jar \
          venue/target/covia.jar.sha256 \
          covia-python-adapter/target/*-module.jar \
          covia-python-adapter/target/*-module.jar.sha256 \
          covia-sql/target/*-module.jar \
          covia-sql/target/*-module.jar.sha256 \
          covia-telegram/target/*-module.jar \
          covia-telegram/target/*-module.jar.sha256 \
          covia-discord/target/*-module.jar \
          covia-discord/target/*-module.jar.sha256 \
          covia-whatsapp/target/*-module.jar \
          covia-whatsapp/target/*-module.jar.sha256 \
          covia-slack/target/*-module.jar \
          covia-slack/target/*-module.jar.sha256 \
          covia-sonnylabs/target/*-module.jar \
          covia-sonnylabs/target/*-module.jar.sha256 \
          covia-documents/target/*-module.jar \
          covia-documents/target/*-module.jar.sha256 \
          covia-speech/target/*-module.jar \
          covia-speech/target/*-module.jar.sha256 \
          covia-claude-code/target/*-module.jar \
          covia-claude-code/target/*-module.jar.sha256
