name: Deploy to Azure

# Deploys the published image to the Azure venue VM. The image itself is
# built and pushed by publish-docker.yml — this workflow only pulls and
# (re)starts the container, after a successful publish from qa or on manual
# dispatch.
#
# No SSH (security#12): the job signs in as the covia-deploy-venue-4 managed
# identity over GitHub OIDC (federated for covia-ai/covia on develop only,
# allowed only to read covia-venue-vm and run commands on it) and runs
# deploy/azure/deploy.sh on the VM through az vm run-command. The job itself
# runs on develop, the default branch, as every workflow_run job does, so a
# manual dispatch must be run from develop too.

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful QA Publish Docker image run ID to deploy
        required: true
        type: string

# Never cancel a mid-flight deploy; queue the newest instead
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          endsWith(github.event.workflow_run.display_title, '[qa]')
        )
      }}
    permissions:
      contents: read
      actions: read
      id-token: write   # OIDC token for the managed identity; no stored secret
    env:
      RESOURCE_GROUP: covia-venue-rg
      VM_NAME: covia-venue-vm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Resolve the published QA image
      id: deployment
      uses: ./.github/actions/deployment
      with:
        run-id: ${{ inputs.publish_run_id || github.event.workflow_run.id }}
        branch: qa

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.deployment.outputs.sha }}

    - name: Sign in as the venue-4 deploy identity (OIDC)
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: 703489f7-5392-4c0c-ac29-14c12cb227d5
        tenant-id: 2b3e3ae4-33a0-473e-9283-73e450dcb8fa
        subscription-id: 4b38d6c0-d585-4c94-ba56-9605ef329acb

    - name: Deploy to Azure VM via run-command
      env:
        DEPLOY_SHA: ${{ steps.deployment.outputs.sha }}
        DEPLOY_IMAGE: ${{ steps.deployment.outputs.image }}
      run: |
        # Ship the script base64-encoded so run-command passes it through
        # unaltered. run-command reports success whatever the script's exit
        # code, so the wrapper prints a result marker for the job to check.
        script=$(base64 -w0 deploy/azure/deploy.sh)
        output=$(az vm run-command invoke \
          --resource-group "$RESOURCE_GROUP" \
          --name "$VM_NAME" \
          --command-id RunShellScript \
          --scripts "if echo $script | base64 -d | DEPLOY_IMAGE='$DEPLOY_IMAGE' bash; then echo COVIA_DEPLOY_RESULT=ok; else echo COVIA_DEPLOY_RESULT=failed; fi" \
          --query 'value[0].message' --output tsv --only-show-errors)
        echo "$output"

        if ! grep -qx 'COVIA_DEPLOY_RESULT=ok' <<<"$output"; then
          echo "::error::venue-4 deploy failed (deploy ${DEPLOY_SHA:0:8})"
          exit 1
        fi
