name: Deploy to GCP

# Deploys a published image to the GCP venue hosts, choosing the host by the
# branch the image was published from (BUILD.md → Development and QA):
#
#   develop → covia-venue-test (venue-test, the dev venue)
#   master  → covia-stable     (venue-1, venue-2, the stable venues)
#
# Each venue runs in its own container (security#6). The image itself is built
# and pushed by publish-docker.yml; this workflow only pulls and (re)starts the
# containers, after a successful publish or on manual dispatch. qa images go to
# venue-3 and venue-4 through deploy-ec2.yml and deploy-azure.yml instead.
#
# Host layout and one-time setup are documented in deploy/gcp/README.md.
#
# No stored SSH key (security#22): each job signs in as the covia-deploy-gcp
# service account over GitHub OIDC (Workload Identity Federation, trusted for
# this workflow file on develop only, allowed only to reach the venue hosts)
# and runs deploy/gcp/deploy.sh on the host through an IAP tunnel with OS
# Login.
#
# workflow_run always runs this file from the default branch (develop), so
# the OIDC token says refs/heads/develop whichever branch the image came from,
# and deploy.sh is taken from the same develop checkout.

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful develop (venue-test) or master (venue-1, venue-2) Publish Docker image run ID to deploy
        required: true
        type: string

jobs:
  plan:
    name: Choose host
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            endsWith(github.event.workflow_run.display_title, '[develop]') ||
            endsWith(github.event.workflow_run.display_title, '[master]')
          )
        )
      }}
    permissions:
      actions: read
    outputs:
      matrix: ${{ steps.host.outputs.matrix }}
    steps:
    - name: Map the publishing branch to its host
      id: host
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ inputs.publish_run_id || github.event.workflow_run.id }}
      run: |
        [[ "$RUN_ID" =~ ^[0-9]+$ ]]
        # The publishing run's title carries the branch its image came from
        # ("Publish Docker image [develop]"); the deployment action checks the
        # same branch against the run's recorded identity.
        title=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .display_title)
        case "$title" in
          *"[develop]") matrix='[{"vm":"covia-venue-test","venues":"venue-test","branch":"develop"}]' ;;
          *"[master]")  matrix='[{"vm":"covia-stable","venues":"venue-1 venue-2","branch":"master"}]' ;;
          *) echo "::error::run $RUN_ID ($title) is not a develop or master publication"; exit 1 ;;
        esac
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "Run $RUN_ID: $title → $(jq -r '.[0].vm' <<<"$matrix")" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ matrix.vm }}
    needs: plan
    runs-on: ubuntu-latest
    # One deploy per host at a time; never cancel a mid-flight deploy, queue
    # the newest instead. Hosts are separate queues, so a develop deploy never
    # replaces a queued master one.
    concurrency:
      group: deploy-gcp-${{ matrix.vm }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write   # OIDC token for the deploy service account; no stored secret
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VM_ZONE: asia-southeast1-b

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Resolve the published image
      id: deployment
      uses: ./.github/actions/deployment
      with:
        run-id: ${{ inputs.publish_run_id || github.event.workflow_run.id }}
        branch: ${{ matrix.branch }}

    - name: Sign in as the GCP deploy service account (OIDC)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: idyllic-pottery-468305-u2
        workload_identity_provider: projects/323115557788/locations/global/workloadIdentityPools/github/providers/covia-covia
        service_account: covia-deploy-gcp@idyllic-pottery-468305-u2.iam.gserviceaccount.com

    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Deploy through IAP
      env:
        VM_NAME: ${{ matrix.vm }}
        VENUES: ${{ matrix.venues }}
        DEPLOY_SHA: ${{ steps.deployment.outputs.sha }}
        DEPLOY_IMAGE: ${{ steps.deployment.outputs.image }}
      run: |
        # Ship the script base64-encoded in the command. ssh exits with the
        # script's exit code, so a failed deploy fails the job. A fresh runner
        # has no known host key; the tunnel itself is authenticated by IAP,
        # which only reaches the venue hosts. DEPLOY_IMAGE was validated as a
        # digest by the deployment action and VENUES comes from the matrix.
        script=$(base64 -w0 deploy/gcp/deploy.sh)
        if ! gcloud compute ssh "$VM_NAME" --zone "$VM_ZONE" \
            --tunnel-through-iap --strict-host-key-checking=no --quiet \
            --command "echo $script | base64 -d | sudo DEPLOY_IMAGE='$DEPLOY_IMAGE' bash -s -- $VENUES"; then
          echo "::error::$VM_NAME deploy failed (deploy ${DEPLOY_SHA:0:8})"
          exit 1
        fi
