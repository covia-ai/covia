name: Deploy to GCP

# Deploys the :stable image to the GCP host running the long-lived venue
# trio (venue-test, venue-1, venue-2 — three venues in a single JVM). The
# image itself is built and pushed by publish-docker.yml on pushes to
# master — this workflow only pulls and (re)starts the container, after a
# successful publish or on manual dispatch.
#
# Host layout and one-time setup are documented in deploy/gcp/README.md.
#
# No stored SSH key (security#22): the job signs in as the covia-deploy-gcp
# service account over GitHub OIDC (Workload Identity Federation, trusted for
# this workflow file on develop only, allowed only to reach the venue VM) and
# runs deploy/gcp/deploy.sh on the VM through an IAP tunnel with OS Login.
#
# workflow_run always runs this file from the default branch (develop), so
# the OIDC token says refs/heads/develop even when the image came from master.

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:

# Never cancel a mid-flight deploy; queue the newest instead
concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          endsWith(github.event.workflow_run.display_title, '[master]')
        )
      }}
    permissions:
      contents: read
      id-token: write   # OIDC token for the deploy service account; no stored secret
    env:
      VM_NAME: venue-test-instance-template-20250815-20250815-20260114-161153
      VM_ZONE: asia-southeast1-b
      # The commit whose image was published (manual runs: the dispatched commit)
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.DEPLOY_SHA }}

    - name: Sign in as the GCP deploy service account (OIDC)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: idyllic-pottery-468305-u2
        workload_identity_provider: projects/323115557788/locations/global/workloadIdentityPools/github/providers/covia-covia
        service_account: covia-deploy-gcp@idyllic-pottery-468305-u2.iam.gserviceaccount.com

    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Deploy to GCP VM through IAP
      run: |
        # Ship the script base64-encoded in the command rather than on stdin,
        # so nothing in it can read the rest of the script as input. ssh exits
        # with the script's exit code, so a failed deploy fails the job.
        # A fresh runner has no known host key; the tunnel itself is
        # authenticated by IAP, which only reaches this instance.
        script=$(base64 -w0 deploy/gcp/deploy.sh)
        gcloud compute ssh "$VM_NAME" --zone "$VM_ZONE" \
          --tunnel-through-iap --strict-host-key-checking=no --quiet \
          --command "echo $script | base64 -d | sudo bash"
