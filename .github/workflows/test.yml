name: Test

# Build-and-test quality gate. Runs the full reactor with tests on every pull
# request and on pushes to the long-lived branches, gating merges.
# See DX_PLAN.md → Milestone 2 ("Add a CI quality gate").

on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ develop, master ]
  workflow_dispatch:

# Supersede in-flight runs when the same branch/PR is pushed again
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up CPython 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Select CPython shared library
      run: |
        library=$(python -c 'import os,sysconfig; print(os.path.join(sysconfig.get_config_var("LIBDIR"), sysconfig.get_config_var("LDLIBRARY")))')
        test -f "$library"
        echo "COVIA_PYTHON_LIBRARY=$library" >> "$GITHUB_ENV"

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build and test (full reactor)
      # Override the default exclusions to RUN the durability group (crash/restart
      # survival tests) — they are excluded from the local `mvn test` inner loop
      # for speed but must gate every push. `integration` stays excluded (external
      # services: network/Ollama).
      run: mvn clean install -Dcovia.excludedTestGroups=integration

    - name: Verify optional module boundaries
      run: |
        test -f covia-python-adapter/target/covia-python-adapter-*-module.jar
        test -f covia-sql/target/covia-sql-*-module.jar
        test -f covia-telegram/target/covia-telegram-*-module.jar
        test -f covia-claude-code/target/covia-claude-code-*-module.jar
        if jar tf venue/target/covia.jar | grep -Eq '^(covia/python/|covia/adapter/python/|covia/adapter/sql/|covia/adapter/telegram/|covia/adapter/claudecode/)'; then
          echo "::error::Optional Python, SQL, Telegram or Claude Code module classes leaked into covia.jar"
          exit 1
        fi

  java21-fallback:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify Java 21 fallback without FFM backend
      run: >-
        mvn clean install -pl covia-python-adapter -am
        -Dtest=PythonRefTest,PythonRuntimeTest,PythonAdapterTest,EngineTest
        -Dsurefire.failIfNoSpecifiedTests=false
