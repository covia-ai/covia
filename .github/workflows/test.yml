name: Test

# Build-and-test quality gate. Runs the full reactor with tests on every pull
# request and on pushes to the long-lived branches, gating merges.
# See DX_PLAN.md → Milestone 2 ("Add a CI quality gate").

on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ develop, master ]
  workflow_dispatch:

# Supersede in-flight runs when the same branch/PR is pushed again
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: no job here writes back to the repo. upload-artifact uses
# the runner's artifact token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A wedged test otherwise runs to GitHub's 6h job cap before it reports.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # JDK 25 before 25.0.3 has JDK-8370887 (timeouts fire tens of seconds late,
    # so tests fail intermittently). check-latest fetches the newest 25 rather
    # than whatever the runner image cached, and -Dcovia.jdk.check=ERROR below
    # fails the build if an affected JDK ever slips through.
    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        check-latest: true
        cache: 'maven'

    - name: Set up CPython 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Select CPython shared library
      run: |
        library=$(python -c 'import os,sysconfig; print(os.path.join(sysconfig.get_config_var("LIBDIR"), sysconfig.get_config_var("LDLIBRARY")))')
        test -f "$library"
        echo "COVIA_PYTHON_LIBRARY=$library" >> "$GITHUB_ENV"

    - name: Build and test (full reactor)
      # Opt into the durability group (@DurabilityTest — crash/restart survival
      # tests that fork real JVMs): off in the local `mvn test` inner loop for
      # speed, but must gate every push. @IntegrationTest (external services:
      # network/Ollama) stays off — enable with -Dcovia.tests.integration=true.
      run: mvn clean install -T 1C -Dcovia.tests.durability=true -Dcovia.jdk.check=ERROR

    - name: Verify optional module boundaries
      run: |
        test -f covia-python-adapter/target/covia-python-adapter-*-module.jar
        test -f covia-sql/target/covia-sql-*-module.jar
        test -f covia-telegram/target/covia-telegram-*-module.jar
        test -f covia-discord/target/covia-discord-*-module.jar
        test -f covia-whatsapp/target/covia-whatsapp-*-module.jar
        test -f covia-slack/target/covia-slack-*-module.jar
        test -f covia-sonnylabs/target/covia-sonnylabs-*-module.jar
        test -f covia-documents/target/covia-documents-*-module.jar
        test -f covia-speech/target/covia-speech-*-module.jar
        test -f covia-claude-code/target/covia-claude-code-*-module.jar
        if jar tf venue/target/covia.jar | grep -Eq '^(covia/python/|covia/adapter/python/|covia/adapter/sql/|covia/adapter/telegram/|covia/adapter/discord/|covia/adapter/whatsapp/|covia/adapter/slack/|covia/adapter/sonnylabs/|covia/adapter/documents/|covia/adapter/speech/|covia/adapter/claudecode/)'; then
          echo "::error::Optional module classes leaked into covia.jar"
          exit 1
        fi

    - name: Share the tested jars with the snapshot and Docker publishers
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: reactor-jars
        path: |
          venue/target/covia.jar
          */target/*-module.jar
        retention-days: 3
        if-no-files-found: error

  java21-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify Java 21 fallback without FFM backend
      run: >-
        mvn clean install -pl covia-python-adapter -am
        -Dtest=PythonRefTest,PythonRuntimeTest,PythonAdapterTest,EngineTest
        -Dsurefire.failIfNoSpecifiedTests=false -Dcovia.jdk.check=ERROR
