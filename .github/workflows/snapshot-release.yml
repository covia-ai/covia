name: Snapshot Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [ develop ]

# Serialise snapshot publishing — concurrent runs race the delete/recreate
# of the latest-snapshot tag (HTTP 422: tag_name already exists)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      actions: read

    steps:
    - uses: actions/checkout@v7
      with:
        # Release the exact commit that passed the Test workflow, not the latest
        # develop commit at the time this runner starts.
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Download the jars the Test run built
      # The exact tested bits, never a rebuild: the Test workflow shares them
      # as the reactor-jars artifact after its module-boundary check.
      uses: actions/download-artifact@v4
      with:
        name: reactor-jars
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Create executable checksum
      working-directory: venue/target
      run: sha256sum covia.jar > covia.jar.sha256

    - name: Create optional module checksums
      run: |
        # Run inside each jar's directory so the checksum file names the bare
        # jar and verifies with `sha256sum -c` next to the downloaded file.
        for jar in covia-python-adapter/target/*-module.jar covia-sql/target/*-module.jar covia-telegram/target/*-module.jar covia-discord/target/*-module.jar covia-whatsapp/target/*-module.jar covia-slack/target/*-module.jar covia-sonnylabs/target/*-module.jar covia-documents/target/*-module.jar covia-claude-code/target/*-module.jar; do
          (cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
        done

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

    - name: Get short SHA
      id: sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Delete existing latest-snapshot release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest-snapshot --yes || true
        git push origin :refs/tags/latest-snapshot || true

    - name: Create latest-snapshot release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create latest-snapshot \
          --title "Latest Snapshot" \
          --notes "Automated snapshot build from develop branch.

        **Commit:** ${{ steps.sha.outputs.sha }}
        **Built:** ${{ steps.date.outputs.date }}

        This release is automatically updated on every push to develop.
        For stable releases, see tagged versions." \
          --prerelease \
          venue/target/covia.jar \
          venue/target/covia.jar.sha256 \
          covia-python-adapter/target/*-module.jar \
          covia-python-adapter/target/*-module.jar.sha256 \
          covia-sql/target/*-module.jar \
          covia-sql/target/*-module.jar.sha256 \
          covia-telegram/target/*-module.jar \
          covia-telegram/target/*-module.jar.sha256 \
          covia-discord/target/*-module.jar \
          covia-discord/target/*-module.jar.sha256 \
          covia-whatsapp/target/*-module.jar \
          covia-whatsapp/target/*-module.jar.sha256 \
          covia-slack/target/*-module.jar \
          covia-slack/target/*-module.jar.sha256 \
          covia-sonnylabs/target/*-module.jar \
          covia-sonnylabs/target/*-module.jar.sha256 \
          covia-documents/target/*-module.jar \
          covia-documents/target/*-module.jar.sha256 \
          covia-claude-code/target/*-module.jar \
          covia-claude-code/target/*-module.jar.sha256
