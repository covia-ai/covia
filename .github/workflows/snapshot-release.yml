name: Snapshot Release

on:
  push:
    branches: [ develop ]

# Serialise snapshot publishing — concurrent runs race the delete/recreate
# of the latest-snapshot tag (HTTP 422: tag_name already exists)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    # convex.version may pin an unreleased -SNAPSHOT while validating
    # convex-side changes (see AGENTS.md). Snapshots are not on Maven
    # Central, so build the needed modules from convex develop source.
    # Skips itself when the pin is a release version.
    - name: Build Convex from source (snapshot pin only)
      run: |
        CONVEX_VERSION=$(sed -n 's/.*<convex.version>\(.*\)<\/convex.version>.*/\1/p' pom.xml | head -1)
        if [[ "$CONVEX_VERSION" == *-SNAPSHOT ]]; then
          echo "convex.version=$CONVEX_VERSION — building convex develop from source"
          git clone --depth 1 --branch develop https://github.com/Convex-Dev/convex.git /tmp/convex
          mvn -f /tmp/convex/pom.xml install -DskipTests -q \
            -pl convex-core,convex-peer,convex-dlfs,convex-java,convex-restapi -am
        else
          echo "convex.version=$CONVEX_VERSION (released) — skipping source build"
        fi

    - name: Build with Maven
      run: mvn clean install -DskipTests

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

    - name: Get short SHA
      id: sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Delete existing latest-snapshot release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest-snapshot --yes || true
        git push origin :refs/tags/latest-snapshot || true

    - name: Create latest-snapshot release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create latest-snapshot \
          --title "Latest Snapshot" \
          --notes "Automated snapshot build from develop branch.

        **Commit:** ${{ steps.sha.outputs.sha }}
        **Built:** ${{ steps.date.outputs.date }}

        This release is automatically updated on every push to develop.
        For stable releases, see tagged versions." \
          --prerelease \
          venue/target/covia.jar
