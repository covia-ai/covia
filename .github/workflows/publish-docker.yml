name: Publish Docker image
run-name: Publish Docker image [${{ github.event.workflow_run.head_branch }}]

# Builds and publishes the public venue image to GHCR. This is the single
# source of ghcr.io/covia-ai/covia tags — the deploy workflows consume the
# image rather than building their own (see DX_PLAN.md → "Decouple the
# public Docker image from deployment").
#
# Tags:
#   :latest  — tracks develop (dev venues: venue-3, venue-4)
#   :stable  — tracks master (stable venues: venue-1, venue-2)
#   :<x.y.z> — release builds (master pushes whose POM version is not a
#              SNAPSHOT, i.e. the "Release x.y.z" commit) — pin deployments here
#   :<sha>   — every published build, for pinning and rollback

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [ develop, master ]

# Newest commit wins the :latest tag — cancel superseded publishes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
    - uses: actions/checkout@v7
      with:
        # workflow_run itself uses the default branch as GITHUB_SHA. Always
        # check out the commit that actually passed Test.
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Download the jars the Test run built
      # The exact tested bits, never a rebuild: the Test workflow shares them
      # as the reactor-jars artifact after its module-boundary check.
      uses: actions/download-artifact@v4
      with:
        name: reactor-jars
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Get short SHA
      id: sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # master publishes the :stable channel (plus :x.y.z for release builds),
    # develop publishes :latest
    - name: Compute image tags
      id: tags
      run: |
        tags="ghcr.io/covia-ai/covia:${{ steps.sha.outputs.sha }}"
        source_branch="${{ github.event.workflow_run.head_branch }}"
        if [ "$source_branch" = "master" ]; then
          tags="$tags,ghcr.io/covia-ai/covia:stable"
          version=$(grep -m1 -oP "(?<=<version>)[^<]+" pom.xml)
          case "$version" in
            *-SNAPSHOT) ;;
            *) tags="$tags,ghcr.io/covia-ai/covia:${version}" ;;
          esac
        else
          tags="$tags,ghcr.io/covia-ai/covia:latest"
        fi
        echo "tags=$tags" >> $GITHUB_OUTPUT

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.tags }}
