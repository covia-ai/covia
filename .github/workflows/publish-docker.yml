name: Publish Docker image
run-name: Publish Docker image [${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}]

# Builds and publishes the public venue image to GHCR. This is the single
# source of ghcr.io/covia-ai/covia tags — the deploy workflows consume the
# image rather than building their own (see DX_PLAN.md → "Decouple the
# public Docker image from deployment").
#
# Tags:
#   :latest  — tracks develop (dev venues: venue-3, venue-4)
#   :stable  — tracks master (stable venues: venue-1, venue-2)
#   :<x.y.z> — release builds (master pushes whose POM version is not a
#              SNAPSHOT, i.e. the "Release x.y.z" commit) — pin deployments here
#   :<sha>   — every published build, for pinning and rollback

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [ develop, master ]
  workflow_dispatch:

# Newest commit wins the :latest tag — cancel superseded publishes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image: ghcr.io/covia-ai/covia:${{ steps.sha.outputs.sha }}
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        # workflow_run itself uses the default branch as GITHUB_SHA. Always
        # check out the commit that actually passed Test.
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    # convex.version may pin an unreleased -SNAPSHOT while validating
    # convex-side changes (see AGENTS.md). Snapshots are not on Maven
    # Central, so build the needed modules from convex develop source.
    # Skips itself when the pin is a release version.
    - name: Build Convex from source (snapshot pin only)
      run: |
        CONVEX_VERSION=$(sed -n 's/.*<convex.version>\(.*\)<\/convex.version>.*/\1/p' pom.xml | head -1)
        if [[ "$CONVEX_VERSION" == *-SNAPSHOT ]]; then
          echo "convex.version=$CONVEX_VERSION — building convex develop from source"
          git clone --depth 1 --branch develop https://github.com/Convex-Dev/convex.git /tmp/convex
          mvn -f /tmp/convex/pom.xml install -DskipTests -q
        else
          echo "convex.version=$CONVEX_VERSION (released) — skipping source build"
        fi

    - name: Build tested commit with Maven
      if: github.event_name == 'workflow_run'
      run: mvn clean install -DskipTests

    - name: Build and test manual dispatch
      if: github.event_name == 'workflow_dispatch'
      run: mvn clean install -Dcovia.excludedTestGroups=integration

    - name: Get short SHA
      id: sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # master publishes the :stable channel (plus :x.y.z for release builds),
    # develop publishes :latest
    - name: Compute image tags
      id: tags
      run: |
        tags="ghcr.io/covia-ai/covia:${{ steps.sha.outputs.sha }}"
        source_branch="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"
        if [ "$source_branch" = "master" ]; then
          tags="$tags,ghcr.io/covia-ai/covia:stable"
          version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *-SNAPSHOT) ;;
            *) tags="$tags,ghcr.io/covia-ai/covia:${version}" ;;
          esac
        else
          tags="$tags,ghcr.io/covia-ai/covia:latest"
        fi
        echo "tags=$tags" >> $GITHUB_OUTPUT

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.tags }}

  verify-public:
    name: Verify anonymous pull and invocation
    needs: publish
    runs-on: ubuntu-latest
    # A fresh runner with no package permission and no registry login catches
    # a private/unlinked GHCR package even when the authenticated push succeeds.
    permissions: {}
    steps:
    - name: Pull the published image anonymously
      env:
        IMAGE: ${{ needs.publish.outputs.image }}
      run: |
        for attempt in 1 2 3 4 5; do
          if docker pull "$IMAGE"; then
            echo "Anonymous access verified: $IMAGE"
            exit 0
          fi
          echo "Image not anonymously visible yet (attempt $attempt/5)"
          sleep 5
        done
        echo "::error::Published image is not anonymously accessible: $IMAGE"
        exit 1

    - name: Run an anonymous invocation
      env:
        IMAGE: ${{ needs.publish.outputs.image }}
      run: |
        cleanup() {
          docker rm -f covia-public-smoke >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        docker run -d --name covia-public-smoke \
          -p 127.0.0.1:18080:8080 \
          "$IMAGE" /app/config/docker-local.json

        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
            break
          fi
          if [ "$attempt" = 30 ]; then
            docker logs covia-public-smoke
            echo "::error::Published venue did not become ready"
            exit 1
          fi
          sleep 1
        done

        curl --fail-with-body --silent --show-error \
          -X POST http://127.0.0.1:18080/api/v1/invoke \
          -H "Content-Type: application/json" \
          -d '{"operation":"v/ops/schema/infer","input":{"value":{"name":"Ada","age":36}},"wait":true}' \
          | tee /tmp/covia-invoke.json

        jq -e '.status == "COMPLETE" and .output.schema.type == "object"' \
          /tmp/covia-invoke.json >/dev/null
