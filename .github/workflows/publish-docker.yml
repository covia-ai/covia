name: Publish Docker image
run-name: Publish Docker image [${{ github.event.workflow_run.head_branch }}]

# Builds and publishes the public venue image to GHCR. This is the single
# source of ghcr.io/covia-ai/covia tags — the deploy workflows consume the
# image rather than building their own (see BUILD.md → Deployment identity
# and redeploys).
#
# Tags:
#   :latest  — tracks qa (dev venues: venue-3, venue-4)
#   :stable  — tracks master (stable venues: venue-1, venue-2)
#   :<x.y.z> — release builds (master pushes whose POM version is not a
#              SNAPSHOT, i.e. the "Release x.y.z" commit) — pin deployments here
#   :<sha>   — every published build, for pinning and rollback

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [ qa, master ]

# Finish each publication; reject superseded candidates before changing tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # workflow_run itself uses the default branch as GITHUB_SHA. Always
        # check out the commit that actually passed Test.
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Download the jars the Test run built
      # The exact tested bits, never a rebuild: the Test workflow shares them
      # as the reactor-jars artifact after its module-boundary check.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: reactor-jars
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Get short SHA
      id: sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # master publishes the :stable channel (plus :x.y.z for release builds),
    # qa publishes :latest
    - name: Compute image tags
      id: tags
      run: |
        tags="ghcr.io/covia-ai/covia:${{ steps.sha.outputs.sha }}"
        source_branch="${{ github.event.workflow_run.head_branch }}"
        if [ "$source_branch" = "master" ]; then
          tags="$tags,ghcr.io/covia-ai/covia:stable"
          version=$(grep -m1 -oP "(?<=<version>)[^<]+" pom.xml)
          case "$version" in
            *-SNAPSHOT) ;;
            *) tags="$tags,ghcr.io/covia-ai/covia:${version}" ;;
          esac
        elif [ "$source_branch" = "qa" ]; then
          tags="$tags,ghcr.io/covia-ai/covia:latest"
        fi
        echo "tags=$tags" >> $GITHUB_OUTPUT

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Refuse a superseded candidate
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq .object.sha)
        if [ "$current" != "$SOURCE_SHA" ]; then
          echo "::error::Candidate was superseded; publish the current branch's successful Test run"
          exit 1
        fi

    - name: Build and push Docker image
      id: image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

    - name: Record the tested source and published image
      env:
        SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        TEST_RUN_ID: ${{ github.event.workflow_run.id }}
        IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
      run: |
        [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        jq -n --arg sha "$SOURCE_SHA" --arg branch "$SOURCE_BRANCH" \
          --arg image "ghcr.io/covia-ai/covia@$IMAGE_DIGEST" \
          --arg test_run_id "$TEST_RUN_ID" \
          '{sha: $sha, branch: $branch, image: $image, test_run_id: $test_run_id}' > deployment.json

    - name: Share deployment identity with the deploy workflows
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: deployment-${{ github.run_attempt }}
        path: deployment.json
        retention-days: 90
        if-no-files-found: error
